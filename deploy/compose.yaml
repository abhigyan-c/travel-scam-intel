name: travel-scam-prod

x-app: &app
  image: ${APP_IMAGE:?Set the immutable application image tag}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  environment: &environment
    APP_ENVIRONMENT: production
    APP_SECRETS_DIR: /run/secrets
    APP_EMBEDDING_CACHE_DIR: /models
    APP_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
    APP_MCP_PUBLIC_ALIASES: ${MCP_PUBLIC_ALIASES:-[]}
    APP_WORKER_MAX_JOBS: "1"
    APP_DATABASE_POOL_SIZE: "2"
    APP_DATABASE_MAX_OVERFLOW: "0"
    APP_RESEARCH_MAX_LLM_CONCURRENCY: "1"
    OMP_NUM_THREADS: "1"
    S3_ENDPOINT: ${S3_ENDPOINT:?Set the R2 S3 endpoint}
    S3_BUCKET: ${S3_BUCKET:-travel-scam-objects-prod}
  volumes:
    - ${MODEL_CACHE:?Set the preloaded model cache path}:/models:ro
  secrets:
    - DATABASE_URL
    - REDIS_URL
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - SERPER_API_KEY
    - SARVAM_API_KEY
    - ADMIN_API_TOKEN
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports: ["127.0.0.1:${API_BIND_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: [arq, app.worker.WorkerSettings]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, arq, app.worker.WorkerSettings, --check]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_DB: travel_scam_intel
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets: [POSTGRES_PASSWORD]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U travel -d travel_scam_intel"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  postgres_data:
  redis_data:

secrets:
  DATABASE_URL: {file: "${SECRETS_PATH:?Set exported runtime secrets path}/DATABASE_URL"}
  REDIS_URL: {file: "${SECRETS_PATH}/REDIS_URL"}
  S3_ACCESS_KEY: {file: "${SECRETS_PATH}/S3_ACCESS_KEY"}
  S3_SECRET_KEY: {file: "${SECRETS_PATH}/S3_SECRET_KEY"}
  SERPER_API_KEY: {file: "${SECRETS_PATH}/SERPER_API_KEY"}
  SARVAM_API_KEY: {file: "${SECRETS_PATH}/SARVAM_API_KEY"}
  ADMIN_API_TOKEN: {file: "${SECRETS_PATH}/ADMIN_API_TOKEN"}
  POSTGRES_PASSWORD: {file: "${SECRETS_PATH}/POSTGRES_PASSWORD"}
