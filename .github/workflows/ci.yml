name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: docker compose --env-file deploy/production.env.example -f deploy/compose.yaml config --quiet
      - run: for script in deploy/*.sh; do bash -n "$script" || exit; done

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: docker compose up --build --wait --wait-timeout 180
      - run: uv run --locked pytest -m integration
        env:
          RUN_INFRA_TESTS: "1"
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
