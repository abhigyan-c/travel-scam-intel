[project]
name = "travel-scam-intel"
version = "0.1.0"
description = "Evidence-backed travel scam intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
