[project]
name = "travel-scam-intel"
version = "0.1.0"
description = "Evidence-backed travel scam intelligence"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<8",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.36,<1",
    "trafilatura>=2.3,<3",
    "langdetect>=1.0.9,<2",
    "arq>=0.26,<0.27",
    "fastembed>=0.7,<0.9",
    "pillow>=12.3,<13",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires running PostgreSQL, Redis and MinIO"]
