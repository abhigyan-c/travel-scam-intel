name: travel-scam-intel

services:
  api:
    build: .
    environment: &app_environment
      APP_NAME: ${APP_NAME:-Travel Scam Intelligence}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel-local}@postgres:5432/${POSTGRES_DB:-travel_scam_intel}}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-raw-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-travel-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-travel-local-password}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    build: .
    environment: *app_environment
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel-local}
      POSTGRES_DB: ${POSTGRES_DB:-travel_scam_intel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-travel-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-travel-local-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
